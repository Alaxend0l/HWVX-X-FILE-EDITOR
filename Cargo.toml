[package]
name = "hwvx-xfile"
version = "0.1.0"
edition = "2021"
description = "Extract and rebuild Hot Wheels: Velocity X .xpc / .xgc / .xps archives"
license = "MIT"

[[bin]]
name = "hwvx-x"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
